<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesforce Customer's Agentic Journey</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:dark;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#010B1C}
body{font-family:var(--font);color:#fff;display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(1200px 760px at 10% -12%, rgba(27,150,255,.30), transparent 62%),
  radial-gradient(1000px 640px at 98% -4%, rgba(167,123,255,.24), transparent 58%),
  radial-gradient(1100px 760px at 55% 118%, rgba(0,224,212,.14), transparent 62%),
  linear-gradient(180deg,#05204A 0%,#02142E 48%,#010B1C 100%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.55;background:radial-gradient(130% 110% at 50% 45%, transparent 38%, rgba(1,11,28,.9) 100%)}
.aur{position:absolute;width:56vw;height:56vw;border-radius:50%;filter:blur(90px);opacity:.4;mix-blend-mode:screen}
.a1{background:radial-gradient(circle,#1B96FF,transparent 66%);top:-18vw;left:-8vw;animation:d1 26s ease-in-out infinite}
.a2{background:radial-gradient(circle,#A77BFF,transparent 66%);bottom:-24vw;right:-12vw;animation:d2 32s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vw,0) scale(1.12)}}
@keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-7vw,-5vw,0) scale(.92)}}
.card{position:relative;z-index:2;width:min(430px,calc(100vw - 40px));padding:38px 36px 32px;border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(18px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 50px 90px -40px rgba(0,0,0,.9);
  animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.eye{display:inline-flex;align-items:center;gap:9px;font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#49C7FF}
.eye i{width:5px;height:5px;border-radius:50%;background:#00E0D4;box-shadow:0 0 12px 2px rgba(0,224,212,.8)}
h1{margin:16px 0 0;font-size:27px;line-height:1.1;letter-spacing:-.035em;font-weight:800;
  background:linear-gradient(180deg,#fff 22%,#C9E2FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:normal;background:linear-gradient(96deg,#49C7FF,#00E0D4 46%,#A77BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{margin:12px 0 26px;font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.52);font-weight:450}
label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:9px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:13px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);color:#fff;font:600 15px/1 var(--mono);letter-spacing:.14em;outline:none;transition:.2s}
input::placeholder{color:rgba(255,255,255,.25);letter-spacing:.1em}
input:focus{border-color:rgba(73,199,255,.65);box-shadow:0 0 0 4px rgba(73,199,255,.12);background:rgba(255,255,255,.1)}
button{height:48px;padding:0 20px;border:0;border-radius:13px;cursor:pointer;color:#021226;font:800 14px/1 var(--font);
  letter-spacing:-.01em;background:linear-gradient(135deg,#8FE4FF,#49C7FF 44%,#1B96FF);
  box-shadow:0 10px 26px -10px rgba(27,150,255,.9),0 0 0 1px rgba(255,255,255,.18) inset;transition:.2s;white-space:nowrap}
button:hover{transform:translateY(-1px);box-shadow:0 16px 34px -10px rgba(27,150,255,1),0 0 0 1px rgba(255,255,255,.3) inset}
button:disabled{opacity:.55;cursor:default;transform:none}
.msg{margin:16px 0 0;min-height:17px;font-size:12px;font-weight:650;color:#FF9B9B;letter-spacing:-.005em;opacity:0;transition:opacity .2s}
.msg.on{opacity:1}
.msg.ok{color:#7FE6B4}
.shake{animation:sh .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes sh{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.foot{margin:24px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:rgba(255,255,255,.3);font-weight:600;letter-spacing:.02em;line-height:1.6}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;z-index:9;background:#010B1C}
</style>
</head>
<body>
<div class="bg"><div class="aur a1"></div><div class="aur a2"></div></div>

<form class="card" id="card" autocomplete="off">
  <div class="eye"><i></i>Quadient × Salesforce</div>
  <h1>Salesforce Customer's<br><em>Agentic Journey</em></h1>
  <p class="s">This walkthrough is protected. Enter the access code you were given to open it.</p>
  <label for="code">Access code</label>
  <div class="row">
    <input id="code" type="password" inputmode="text" placeholder="••••••••" autofocus spellcheck="false">
    <button id="go" type="submit">Unlock</button>
  </div>
  <p class="msg" id="msg"></p>
  <div class="foot">Content is encrypted in the page itself — nothing is readable without the code.</div>
</form>

const $=i=>document.getElementById(i);
const dec=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
function say(t,ok){const m=$('msg');m.textContent=t;m.className='msg on'+(ok?' ok':'');}
async function open_(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(IV)},key,dec(CT));
  return new TextDecoder().decode(pt);
}
function show(html){
  const f=document.createElement('iframe');
  f.id='frame'; f.setAttribute('allow','autoplay'); f.setAttribute('title','Agentic Journey');
  f.srcdoc=html;
  f.addEventListener('load',()=>{try{f.contentWindow.focus();}catch(e){}});
  $('card').remove();
  document.body.appendChild(f);
  document.documentElement.style.overflow='hidden';
  addEventListener('keydown',e=>{
    if(!f.contentWindow) return;
    if(e.key===' '||e.key.startsWith('Arrow')) e.preventDefault();
    f.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,bubbles:true,cancelable:true}));
  });
}
async function submit(code,quiet){
  if(!code) return;
  $('go').disabled=true; if(!quiet) say('Decrypting…',true);
  try{
    const html=await open_(code);
    try{sessionStorage.setItem('ajc',code);}catch(e){}
    show(html);
  }catch(e){
    $('go').disabled=false;
    if(quiet){try{sessionStorage.removeItem('ajc');}catch(_){} return;}
    say('Wrong code — try again.');
    $('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake');
    $('code').value='';$('code').focus();
  }
}
$('card').addEventListener('submit',e=>{e.preventDefault();submit($('code').value.trim());});
if(!window.crypto||!crypto.subtle) say('This browser cannot decrypt the page. Open it over https.');
try{const s=sessionStorage.getItem('ajc'); if(s) submit(s,true);}catch(e){}
